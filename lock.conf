# i3lock-color options, read by lock.sh. One option per line; lines starting with # are ignored.
# Quote values with spaces. No inline comments, no $VARS or ~ (not run through a shell).
# Colors are RRGGBBAA from the Kanagawa palette:
#   fujiWhite DCD7BA, oldWhite C8C093, springBlue 7FB4CA, carpYellow E6C384, autumnRed C34043

# Image scaled to fill each monitor, centered
--fill

# Ring and clock, always shown, in the dark sky right of the wave
--indicator
--clock
--ind-pos=x+w*0.72:y+h*0.34
--radius=120
--ring-width=4

# Idle
--inside-color=00000000
--ring-color=DCD7BA40
--line-color=00000000
--separator-color=00000000

# Typing (springBlue) and backspace (autumnRed)
--keyhl-color=7FB4CAff
--bshl-color=C34043ff

# Checking password (carpYellow)
--insidever-color=00000000
--ringver-color=E6C384ff
--verif-text=…
--verif-font="EB Garamond"
--verif-size=40
--verif-color=E6C384ff

# Wrong password (autumnRed)
--insidewrong-color=C3404326
--ringwrong-color=C34043ff
--wrong-text="try again"
--wrong-font="EB Garamond"
--wrong-size=22
--wrong-color=C34043ff

# Clock
--time-str=%H:%M
--time-font="EB Garamond"
--time-size=56
--time-color=DCD7BAff
--date-str="%A, %d %B"
--date-font="EB Garamond"
--date-size=18
--date-color=C8C093cc

# Misc text
--noinput-text=empty
--greeter-text=
--layout-color=C8C093cc
--modif-color=C8C093cc
